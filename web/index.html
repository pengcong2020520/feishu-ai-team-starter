<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 团队工作台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="top-left"><button id="back" class="icon-button" hidden>← 看板</button><div><h1 id="page-title">AI 团队工作台</h1><p id="page-subtitle">3 个 AI 同事在做什么、哪里在等你</p></div></div>
  <div class="top-right"><span class="counter"><b id="count-active">0</b> 进行中</span><span class="counter waiting"><b id="count-waiting">0</b> 等你处理</span><span class="counter working"><b id="count-working">0</b> 在干活</span><span class="sync"><i id="sync-dot"></i><span id="sync-label">飞书同步中</span></span><button id="team-entry" type="button">人员与职责</button><button id="new-demand" class="primary" type="button">＋ 提需求</button></div>
</header>
<main>
<div id="notice" role="status"></div>
<section id="board-view" class="view"><div id="board" class="board"></div><footer id="colleagues" class="colleagues"></footer></section>
<section id="project-view" class="view" hidden>
  <aside class="flow-panel"><h2>流程</h2><div id="flow-steps"></div><div id="flow-error" class="flow-error" hidden></div><div class="demand-original"><h3>需求原文</h3><p id="demand-original"></p></div><div id="project-team" class="project-team" hidden></div></aside>
  <section class="artifact-panel"><div class="artifact-head"><div id="artifact-tabs" class="tabs"></div><div class="artifact-tools"><button id="project-team-open" type="button" hidden>项目成员</button><a id="project-chat" target="_blank" rel="noopener" hidden>进入飞书群</a><a id="artifact-open" target="_blank" rel="noopener">新标签页打开 ↗</a></div></div><div id="artifact-content"></div></section>
  <aside class="conversation"><div class="panel-heading"><h2>消息与卡片</h2><span id="message-count"></span></div><div id="project-messages" class="message-list"></div><form id="project-form"><div class="compose-head"><label>发给 <select id="project-role"><option value="product">AI 产品经理</option><option value="designer">AI 设计</option><option value="developer">AI 程序员</option></select></label></div><textarea id="project-input" placeholder="说说你的想法，按 Enter 发送…"></textarea><button class="primary" type="submit">发送 ↗</button></form></aside>
</section>
<section id="roles-view" class="view" hidden>
  <aside id="role-list" class="role-list"></aside>
  <section class="role-conversation"><div class="role-chat-head"><div id="role-header"></div><button id="role-source" type="button">角色说明与技能 ↗</button></div><div id="role-messages" class="message-list"></div><form id="role-form"><div class="compose-head"><label>项目 <select id="role-project"></select></label><span id="role-project-hint"></span></div><textarea id="role-input" placeholder="给这位同事发消息，按 Enter 发送…"></textarea><button class="primary" type="submit">发送 ↗</button></form></section>
</section>
<section id="team-view" class="view" hidden>
  <aside id="team-side" class="team-side"></aside>
  <section class="team-main"><div class="panel-heading"><h2>人员名册</h2><button id="person-add" type="button">新增人员</button></div><div id="people-list" class="people-list"></div></section>
</section>
</main>
<dialog id="demand-dialog">
  <form id="demand-form">
    <h2>提新需求</h2>
    <p id="demand-hint">群聊空闲时发给最近使用的群；群聊忙时在工作台单独开始。</p>
    <div id="demand-extra" hidden>
      <label>项目名称<input id="demand-name" maxlength="80" placeholder="不填则从需求里取"></label>
      <label>负责范围<textarea id="demand-scope" maxlength="500" placeholder="这个项目要负责的范围，可留空"></textarea></label>
      <fieldset>
        <legend>创建位置</legend>
        <label class="check"><input id="channel-feishu" type="radio" name="channel" value="feishu">飞书新项目群</label>
        <label class="check"><input id="channel-local" type="radio" name="channel" value="local">本机项目</label>
        <p id="channel-note" class="muted"></p>
      </fieldset>
      <fieldset>
        <legend>人员分工（可选）</legend>
        <p class="muted">不选则按负责范围匹配；无人匹配的确认事项由负责人处理。没有飞书身份的人员适合本机项目。</p>
        <label>负责人<select id="demand-owner"></select></label>
        <div id="demand-members" class="stack"></div>
        <div id="demand-approvers" class="stack"></div>
      </fieldset>
    </div>
    <label>需求<textarea id="demand-text" required maxlength="4000" placeholder="描述你想做的网页…"></textarea></label>
    <div class="dialog-actions"><button type="button" id="demand-cancel">取消</button><button class="primary" id="demand-submit" type="submit">提交需求</button></div>
  </form>
</dialog>
<dialog id="person-dialog">
  <form id="person-form">
    <h2 id="person-title">新增人员</h2>
    <label>姓名<input id="person-name" required maxlength="40" autocomplete="off"></label>
    <label class="check"><input id="person-active" type="checkbox" checked>启用</label>
    <p id="person-identity" class="muted"></p>
    <div class="duty-head"><h3>岗位与范围</h3><button id="duty-add" type="button">添加一行</button></div>
    <div id="duty-rows"></div>
    <div class="dialog-actions"><button type="button" id="person-cancel">取消</button><button class="primary" type="submit">保存</button></div>
  </form>
</dialog>
<dialog id="project-team-dialog">
  <form id="project-team-form">
    <h2>项目分工</h2>
    <p id="project-team-hint" class="muted"></p>
    <p id="project-team-scope" class="muted"></p>
    <label>负责人<select id="project-owner" required></select></label>
    <fieldset>
      <legend>项目成员</legend>
      <div id="project-members" class="stack"></div>
    </fieldset>
    <fieldset>
      <legend>关口确认人</legend>
      <div id="project-approvers" class="stack"></div>
    </fieldset>
    <div class="dialog-actions"><button type="button" id="project-team-cancel">取消</button><button class="primary" id="project-team-save" type="submit">保存</button></div>
  </form>
</dialog>
<dialog id="source-dialog"><div class="source-head"><h2 id="source-title"></h2><div><button id="source-copy" type="button">复制原文</button><button id="source-close" type="button">关闭</button></div></div><pre id="source-content"></pre></dialog>
<script src="/app.js" type="module"></script>
</body>
</html>
