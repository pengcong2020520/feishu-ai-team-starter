<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 团队工作台</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="topbar"><div class="top-left"><button id="back" class="icon-button" hidden>← 看板</button><div><h1 id="page-title">AI 团队工作台</h1><p id="page-subtitle">3 个 AI 同事在做什么、哪里在等你</p></div></div><div class="top-right"><span class="counter"><b id="count-active">0</b> 进行中</span><span class="counter waiting"><b id="count-waiting">0</b> 等你处理</span><span class="counter working"><b id="count-working">0</b> 在干活</span><span class="sync"><i id="sync-dot"></i><span id="sync-label">飞书同步中</span></span><button id="new-demand" class="primary">＋ 提需求</button></div></header>
<main><div id="notice" role="status"></div>
<section id="board-view" class="view"><div id="board" class="board"></div><footer id="colleagues" class="colleagues"></footer></section>
<section id="project-view" class="view" hidden><aside class="flow-panel"><h2>流程</h2><div id="flow-steps"></div><div id="flow-error" class="flow-error" hidden></div><div class="demand-original"><h3>需求原文</h3><p id="demand-original"></p></div></aside><section class="artifact-panel"><div class="artifact-head"><div id="artifact-tabs" class="tabs"></div><a id="artifact-open" target="_blank" rel="noopener">新标签页打开 ↗</a></div><div id="artifact-content"></div></section><aside class="conversation"><div class="panel-heading"><h2>消息与卡片</h2><span id="message-count"></span></div><div id="project-messages" class="message-list"></div><form id="project-form"><div class="compose-head"><label>发给 <select id="project-role"><option value="product">AI 产品经理</option><option value="designer">AI 设计</option><option value="developer">AI 程序员</option></select></label></div><textarea id="project-input" placeholder="说说你的想法，按 Enter 发送…"></textarea><button class="primary">发送 ↗</button></form></aside></section>
<section id="roles-view" class="view" hidden><aside id="role-list" class="role-list"></aside><section class="role-conversation"><div class="role-chat-head"><div id="role-header"></div><button id="role-source">角色说明与技能 ↗</button></div><div id="role-messages" class="message-list"></div><form id="role-form"><div class="compose-head"><label>项目 <select id="role-project"></select></label><span id="role-project-hint"></span></div><textarea id="role-input" placeholder="给这位同事发消息，按 Enter 发送…"></textarea><button class="primary">发送 ↗</button></form></section></section>
</main>
<dialog id="demand-dialog"><form id="demand-form"><h2>提新需求</h2><p>群聊空闲时发给最近使用的群；群聊忙时在工作台单独开始。</p><textarea id="demand-text" required maxlength="4000" placeholder="描述你想做的网页…"></textarea><div class="dialog-actions"><button type="button" id="demand-cancel">取消</button><button class="primary">提交需求</button></div></form></dialog>
<dialog id="source-dialog"><div class="source-head"><h2 id="source-title"></h2><div><button id="source-copy">复制原文</button><button id="source-close">关闭</button></div></div><pre id="source-content"></pre></dialog><script src="/app.js" type="module"></script></body></html>
