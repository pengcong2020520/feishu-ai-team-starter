<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 团队工作台</title><meta name="theme-color" content="#070b14"><link rel="stylesheet" href="/teams.css"><link rel="stylesheet" href="/cyber.css"></head><body>
<aside id="sidebar">
  <a class="brand" href="/teams"><span class="brand-mark">◈</span><strong>飞书 AI 团队</strong></a>
  <div id="current-team"></div>
  <nav aria-label="工作台导航"><button id="board-nav" class="nav-item selected">工作看板</button><button id="archive-nav" class="nav-item">项目档案</button></nav>
  <div class="sidebar-projects"><h2>项目</h2><div id="project-nav"></div><div id="role-nav"></div></div>
  <div class="sidebar-bottom"><a href="/admin/team-lab" class="nav-item" title="管理员调试"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H9l-4 4zM9 8h6M9 12h4"/></svg> 管理员调试</a><button id="ecosystem-open" class="nav-item">团队生态</button><button id="settings-open" class="nav-item">服务设置</button><div id="feishu-status" class="connection-status"></div></div>
</aside>
<div id="workspace"><header class="topbar"><div id="breadcrumb">工作看板</div><span id="capacity" role="status">正在连接服务</span><button id="new" class="primary">＋ 新项目</button></header>
<main id="content"><div id="overview"></div><div id="detail" hidden></div><div id="role-page" hidden></div></main><div id="role-dock" hidden></div><div id="role-popover" hidden role="dialog" aria-label="角色任务"></div></div>
<dialog id="ecosystem"><div class="source-head"><h2>团队生态</h2><button id="ecosystem-close">关闭</button></div><p class="muted">选择一套成熟团队作为当前工作台。已有项目继续使用原来的角色与工作流。</p><div id="catalog"></div></dialog>
<dialog id="settings"><div class="source-head"><h2>服务设置</h2><button id="settings-close">关闭</button></div><div id="settings-content"></div></dialog>
<dialog id="artifact-preview" class="wide-dialog"><div class="source-head"><div><h2 id="artifact-title">文稿预览</h2><small id="artifact-meta"></small></div><button id="artifact-close" aria-label="关闭文稿预览">关闭</button></div><div id="artifact-body"></div><div id="artifact-footer"></div></dialog><dialog id="workflow-dialog" class="wide-dialog"><div class="source-head"><h2>项目流程</h2><button id="workflow-close">关闭</button></div><div id="workflow-content"></div></dialog>
<dialog id="create"><form id="create-form"><h2>创建团队项目</h2><label>当前团队<select id="package" required disabled></select></label><p id="team-description" class="muted"></p><label>试跑示例<select id="example"></select></label><label>项目名称<input id="name" maxlength="60" required></label><label>项目目标<textarea id="demand" rows="5" maxlength="4000" required></textarea></label><label>审核方式<select id="review-mode"><option value="">沿用安装时设置</option><option value="human">人工确认 · 关键阶段暂停审核</option><option value="auto">自动审核 · 独立检查，不通过就停下</option></select></label><label>协作位置<select id="channel"><option value="feishu">新建飞书项目群</option><option value="local">仅本机试跑</option></select></label><p id="bindings" class="muted"></p><div class="actions"><button type="button" id="connect-create">扫码连接飞书</button><button type="button" id="cancel">取消</button><button class="primary" id="start">确认目标并开工</button></div><p id="create-error" class="error"></p></form></dialog>
<dialog id="source"><div class="source-head"><h2 id="source-title"></h2><button id="source-close">关闭</button></div><div id="source-content"></div></dialog>
<div id="notice" role="status"></div><script type="module" src="/teams.js"></script></body></html>
