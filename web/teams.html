<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 团队 · 团队与项目</title><link rel="stylesheet" href="/teams.css"></head><body>
<header><a href="/">← 网页工作台</a><div><strong>团队与项目</strong><small>选择一支团队，把目标交给它们</small></div><span id="capacity"></span><button id="new" class="primary">＋ 新项目</button></header>
<main><aside><h2>我的团队</h2><div id="catalog"></div><p class="muted">作者可通过项目内的 team-packager Skill 分享完整团队。安装命令见 README 的“团队包”。</p><a href="/">人员与职责在原工作台中维护 →</a></aside><section id="content"><div id="overview"></div><div id="detail" hidden></div></section></main>
<dialog id="create"><form id="create-form"><h2>交给哪支团队？</h2><label>团队<select id="package" required></select></label><p id="team-description" class="muted"></p><label>项目名称<input id="name" maxlength="60" required></label><label>想完成什么<textarea id="demand" rows="5" maxlength="4000" required></textarea></label><label>在哪里协作<select id="channel"><option value="local">本机工作台</option><option value="feishu">新建飞书项目群</option></select></label><p id="bindings" class="muted"></p><details><summary>成员与确认人</summary><p class="muted">默认按职责匹配；未匹配的关口交给负责人。可在这里明确指定。</p><label>项目负责人<select id="owner"></select></label><div id="members"></div><div id="approvers"></div></details><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="start">确认目标并开工</button></div><p id="create-error" class="error"></p></form></dialog>
<div id="notice" role="status"></div><script type="module" src="/teams.js"></script></body></html>
