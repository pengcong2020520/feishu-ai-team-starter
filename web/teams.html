<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 团队工作台</title><link rel="stylesheet" href="/teams.css"></head><body>
<header><div><strong>AI 团队工作台</strong><small>飞书协作 · 每个项目独立运行</small></div><span id="capacity"></span><button id="new" class="primary">＋ 新项目</button></header>
<main><aside><h2>我的 AI 团队</h2><div id="catalog"></div><p class="muted">团队的角色、Skill 和协作流程来自已安装的团队包。</p></aside><section id="content"><div id="overview"></div><div id="detail" hidden></div></section></main>
<dialog id="create"><form id="create-form"><h2>创建团队项目</h2><label>团队<select id="package" required></select></label><p id="team-description" class="muted"></p><label>试跑示例<select id="example"></select></label><label>项目名称<input id="name" maxlength="60" required></label><label>项目目标<textarea id="demand" rows="5" maxlength="4000" required></textarea></label><label>审核方式<select id="review-mode"><option value="">沿用安装时设置</option><option value="human">人工确认 · 关键阶段暂停审核</option><option value="auto">自动审核 · 独立检查，不通过就停下</option></select></label><label>协作位置<select id="channel"><option value="feishu">新建飞书项目群</option><option value="local">仅本机试跑</option></select></label><p id="bindings" class="muted"></p><div class="actions"><button type="button" id="connect-create">扫码连接飞书</button><button type="button" id="cancel">取消</button><button class="primary" id="start">确认目标并开工</button></div><p id="create-error" class="error"></p></form></dialog>
<dialog id="source"><div class="source-head"><h2 id="source-title"></h2><button id="source-close">关闭</button></div><div id="source-content"></div></dialog>
<div id="notice" role="status"></div><script type="module" src="/teams.js"></script></body></html>
