name: feishu-ai-team
services:
  team:
    image: feishu-ai-team:current
    build: .
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    environment:
      PREVIEW_HOST: 0.0.0.0
      PREVIEW_PORT: 4870
      PUBLIC_WORKBENCH_BASE: http://127.0.0.1:4880
      PUBLIC_PREVIEW_BASE: http://127.0.0.1:4881
      CHROME_PATH: /usr/bin/chromium
      SERVICE_LOG_FILE: data/service.log
    ports:
      - "127.0.0.1:4880:4870"
      - "127.0.0.1:4881:4871"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./workspace:/app/workspace
