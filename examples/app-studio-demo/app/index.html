<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读书会报名</title><style>body{font:16px system-ui;max-width:36rem;margin:4rem auto;padding:1rem;color:#17233b}main{padding:2rem;border:1px solid #dde3ee;border-radius:1rem}input,button{padding:.7rem;font:inherit}button{background:#1458e3;color:white;border:0;border-radius:.4rem}li{margin:.6rem 0}</style><main><h1>读书会报名</h1><p>名额 10 人。填写姓名后，系统会保存报名。</p><form><input name="name" maxlength="40" required aria-label="姓名" placeholder="你的姓名"><button>报名</button></form><p id="notice" role="status"></p><h2>已报名</h2><ul id="people"></ul></main><script>const form=document.querySelector('form'),notice=document.querySelector('#notice'),people=document.querySelector('#people');async function load(){const result=await fetch('/api/registrations').then(r=>r.json());people.replaceChildren(...result.items.map(item=>{const li=document.createElement('li');li.textContent=item.name;return li;}));}form.onsubmit=async e=>{e.preventDefault();const response=await fetch('/api/registrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:form.elements.namedItem('name').value})});const result=await response.json();notice.textContent=response.ok?'报名成功':result.error;if(response.ok){form.reset();await load();}};load();</script></html>
